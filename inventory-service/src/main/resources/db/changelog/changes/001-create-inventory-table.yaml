databaseChangeLog:
  - changeSet:
      id: 001-create-inventory-table
      author: lucas
      changes:
        - createTable:
            tableName: inventory
            columns:
              - column:
                  name: id
                  type: VARCHAR(36)
                  constraints:
                    primaryKey: true
                    nullable: false
              - column:
                  name: sku_code
                  type: VARCHAR(255)
                  constraints:
                    nullable: false
                    unique: true
              - column:
                  name: quantity
                  type: INT
                  constraints:
                    nullable: false
              - column:
                  name: created_at
                  type: DATETIME(6)
              - column:
                  name: updated_at
                  type: DATETIME(6)