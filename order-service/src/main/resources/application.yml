server:
  port: 8082

spring:
  application:
    name: order-service
  datasource:
    url: jdbc:postgresql://localhost:5433/order_service
    username: root
    password: root
  jpa:
    hibernate:
      ddl-auto: validate
  kafka:
    bootstrap-servers: localhost:9092

# Eureka service name, not a host: resolved by the load-balanced RestClient.
inventory:
  url: http://inventory-service
