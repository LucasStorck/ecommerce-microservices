databaseChangeLog:
  - changeSet:
      id: 002-create-order-items-table
      author: lucas
      changes:
        - createTable:
            tableName: order_items
            columns:
              - column:
                  name: id
                  type: VARCHAR(36)
                  constraints:
                    primaryKey: true
                    nullable: false
              - column:
                  name: sku_code
                  type: VARCHAR(255)
                  constraints:
                    nullable: false
              - column:
                  name: price
                  type: DECIMAL(10,2)
                  constraints:
                    nullable: false
              - column:
                  name: quantity
                  type: INT
                  constraints:
                    nullable: false
              - column:
                  name: order_id
                  type: VARCHAR(36)
                  constraints:
                    foreignKeyName: fk_order_items_order
                    references: orders(id)